name: Turso Platform Sync (Disabled)
# Stubbed: this workflow runs Turso/Supabase sync and requires production
# secrets. It is disabled by default for open-source contributors.
# Re-enable by removing the `if: false` guard and setting the required secrets.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - validate-only

jobs:
  sync:
    if: false  # Remove this line and configure secrets to enable.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install supabase libsql-experimental

      - name: Run Turso sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          if [ "$MODE" = "full" ]; then
            python scripts/turso/sync_platform.py --full
          elif [ "$MODE" = "validate-only" ]; then
            python scripts/turso/sync_platform.py --validate-only
          else
            python scripts/turso/sync_platform.py
          fi
