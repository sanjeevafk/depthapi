<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepthAPI — Demo</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            900: '#064e3b',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* Glassmorphism utilities */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Markdown styling overrides */
        .prose pre {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .prose a { color: #34d399; text-decoration: none; }
        .prose a:hover { text-decoration: underline; }
        .prose code:not(pre code) {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.15), transparent 25%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col font-sans antialiased overflow-y-auto overflow-x-hidden">

    <!-- Navbar -->
    <header class="glass sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center font-bold text-white shadow-lg">D</div>
                <h1 class="text-xl font-semibold tracking-tight text-white">Depth<span class="text-emerald-400">API</span></h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 ml-2">v2.0</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="/presentation" class="text-xs font-medium text-amber-300/80 hover:text-amber-200 border border-amber-500/20 bg-amber-500/5 px-3 py-1.5 rounded-full transition-colors">Presentation Deck</a>
                <div id="status-indicator" class="flex items-center gap-2 text-sm text-slate-400 transition-colors">
                    <div class="w-2 h-2 rounded-full bg-slate-500" id="status-dot"></div>
                    <span id="status-text">Checking system...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[calc(100vh-4rem)]">
        
        <!-- Sidebar Controls (Left) -->
        <div class="lg:col-span-3 flex flex-col gap-6 overflow-y-auto pr-2 pb-8">
            
            <!-- Query Formulation -->
            <div class="glass-panel rounded-xl p-5 space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    New Query
                </h2>
                
                <form id="query-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Topic / Question</label>
                        <textarea id="topic" required rows="3" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all text-white placeholder-slate-500 resize-none" placeholder="e.g., Explain the architecture of a Retrieval-Augmented Generation system."></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Cognitive Depth</label>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="depth" value="accessible" checked class="peer sr-only">
                                <div class="text-center px-3 py-2 bg-slate-800/50 border border-slate-700 rounded-lg text-sm peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 transition-all">Accessible</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="depth" value="technical" class="peer sr-only">
                                <div class="text-center px-3 py-2 bg-slate-800/50 border border-slate-700 rounded-lg text-sm peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-400 transition-all">Technical</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="depth" value="simple" class="peer sr-only">
                                <div class="text-center px-3 py-2 bg-slate-800/50 border border-slate-700 rounded-lg text-sm peer-checked:bg-green-500/20 peer-checked:border-green-500 peer-checked:text-green-400 transition-all">Simple</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="depth" value="expert" class="peer sr-only">
                                <div class="text-center px-3 py-2 bg-slate-800/50 border border-slate-700 rounded-lg text-sm peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-400 transition-all">Expert</div>
                            </label>
                        </div>
                        
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-400 mb-1">Chat Mode</label>
                            <select id="chat-mode" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                                <option value="learn" selected>Learning (Conceptual RAG)</option>
                                <option value="technical">Technical (Deep RAG)</option>
                                <option value="socratic">Socratic (Guided Questions)</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Task</label>
                                <select id="task" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                                    <option value="explain" selected>Explain</option>
                                    <option value="compare">Compare</option>
                                    <option value="brainstorm">Brainstorm</option>
                                    <option value="analyze">Analyze</option>
                                    <option value="summarize">Summarize</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Reasoning</label>
                                <select id="reasoning" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                                    <option value="direct" selected>Direct</option>
                                    <option value="socratic">Socratic</option>
                                    <option value="debate">Debate</option>
                                    <option value="guided">Guided</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-400 mb-1">Style</label>
                            <select id="style" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                                <option value="normal" selected>Normal</option>
                                <option value="meme">Meme</option>
                                <option value="concise">Concise</option>
                                <option value="academic">Academic</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="w-full py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-lg font-medium transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                        <span>Execute Query</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>
            </div>
            
            <!-- Pipeline Settings -->
            <div class="glass-panel rounded-xl p-5 space-y-4">
                 <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">Pipeline Settings</h2>
                 
                 <div class="space-y-3">
                     <div>
                         <label class="block text-xs font-medium text-slate-400 mb-1">API Key</label>
                         <input type="text" id="api-key" value="sk-depth-local-dev" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-emerald-400 focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="sk-depth-..." />
                     </div>

                     <label class="flex items-center justify-between cursor-pointer group">
                         <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Stream Response</span>
                         <div class="relative">
                             <input type="checkbox" id="use-streaming" class="sr-only peer" checked>
                             <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                         </div>
                     </label>
                     
                     <label class="flex items-center justify-between cursor-pointer group">
                         <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Bypass Cache</span>
                         <div class="relative">
                             <input type="checkbox" id="bypass-cache" class="sr-only peer">
                             <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                         </div>
                     </label>
                 </div>
            </div>
        </div>

        <!-- Response Area (Right/Main) -->
        <div class="lg:col-span-9 flex flex-col gap-6 h-full min-h-[500px]">
            <div class="glass-panel rounded-xl flex flex-col flex-1 overflow-hidden relative">
                
                <!-- Output Header -->
                <div class="border-b border-slate-700/50 bg-slate-800/30 p-4 flex justify-between items-center z-10">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="processing-dot" style="display: none;"></div>
                        <h3 class="font-medium text-slate-200" id="response-title">Output Console</h3>
                    </div>
                    <div class="flex items-center gap-2" id="telemetry-badges" style="display: none;">
                        <span id="badge-time" class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-xs font-mono text-slate-400">0ms</span>
                        <span id="badge-model" class="px-2 py-1 bg-teal-500/10 border border-teal-500/30 rounded text-xs font-mono text-teal-300">Model</span>
                    </div>
                </div>
                
                <!-- Output Body -->
                <div class="flex-1 overflow-y-auto p-6 relative" id="output-container">
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-8 text-center">
                        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <p class="text-lg font-medium text-slate-400">Awaiting Query</p>
                        <p class="text-sm mt-2 max-w-md">Configure your prompt specifications on the left and execute to observe the retrieval-augmented generation pipeline.</p>
                    </div>
                    
                    <!-- Content State -->
                    <div id="response-content" class="prose prose-invert prose-emerald max-w-none hidden"></div>
                    
                </div>
                
                <!-- Citations Footer -->
                <div id="citations-panel" class="border-t border-slate-700/50 bg-slate-900/50 p-4 hidden">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Retrieved Context Sources</h4>
                    <div id="citations-list" class="flex flex-wrap gap-2">
                        <!-- Citations populated dynamically -->
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <script>
        // Configure marked.js for secure, highlighted rendering
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            breaks: true,
            gfm: true
        });

        // UI Elements
        const form = document.getElementById('query-form');
        const submitBtn = document.getElementById('submit-btn');
        const outputContainer = document.getElementById('output-container');
        const emptyState = document.getElementById('empty-state');
        const responseContent = document.getElementById('response-content');
        const processingDot = document.getElementById('processing-dot');
        const telemetryBadges = document.getElementById('telemetry-badges');
        const badgeTime = document.getElementById('badge-time');
        const badgeModel = document.getElementById('badge-model');
        const citationsPanel = document.getElementById('citations-panel');
        const citationsList = document.getElementById('citations-list');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // Health Check Polling
        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                
                if (data.status === 'ok') {
                    statusDot.className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]';
                    statusText.textContent = `API Online (${data.provider_stack.reachable ? 'LLM Ready' : 'LLM Offline'})`;
                    statusText.className = 'text-sm text-green-400';
                } else {
                    statusDot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)]';
                    statusText.textContent = 'System Degraded';
                    statusText.className = 'text-sm text-amber-400';
                }
            } catch (err) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]';
                statusText.textContent = 'API Disconnected';
                statusText.className = 'text-sm text-red-400';
            }
        }
        
        // Check health immediately and every 15s
        checkHealth();
        setInterval(checkHealth, 15000);

        function resolveChatMode(reasoning) {
            const explicitMode = document.getElementById('chat-mode').value;
            if (reasoning === 'socratic') return 'socratic';
            return explicitMode;
        }

        document.getElementById('reasoning').addEventListener('change', (event) => {
            if (event.target.value === 'socratic') {
                document.getElementById('chat-mode').value = 'socratic';
            }
        });

        // Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value.trim();
            if (!topic) return;
            
            const depth = document.querySelector('input[name="depth"]:checked').value;
            const task = document.getElementById('task').value;
            const reasoning = document.getElementById('reasoning').value;
            const style = document.getElementById('style').value;
            const apiKey = document.getElementById('api-key').value.trim() || 'sk-depth-local-dev';
            const useStream = document.getElementById('use-streaming').checked;
            const bypassCache = document.getElementById('bypass-cache').checked;
            
            // Set UI to loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing`;
            
            emptyState.style.display = 'none';
            responseContent.style.display = 'block';
            responseContent.innerHTML = '';
            processingDot.style.display = 'block';
            telemetryBadges.style.display = 'none';
            citationsPanel.style.display = 'none';
            
            const chatMode = resolveChatMode(reasoning);
            document.getElementById('chat-mode').value = chatMode;

            const payload = {
                topic: topic,
                mode: chatMode,
                bypass_cache: bypassCache,
                prompt_spec: {
                    depth: depth,
                    task: task,
                    reasoning: reasoning,
                    style: style,
                    capabilities: ["requires_search"]
                }
            };
            
            const startTime = performance.now();
            
            try {
                if (useStream) {
                    await handleStreamingRequest(payload, depth, startTime, apiKey);
                } else {
                    await handleStandardRequest(payload, depth, startTime, apiKey);
                }
            } catch (error) {
                responseContent.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-lg">
                    <strong>Error Execution Failed:</strong> ${error.message || 'Unknown error occurred while connecting to the API.'}
                </div>`;
            } finally {
                // Reset UI
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Execute Query</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
                processingDot.style.display = 'none';
            }
        });

        async function handleStandardRequest(payload, depth, startTime, apiKey) {
            const res = await fetch('/api/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                let errMsg = errData.detail || `HTTP ${res.status}`;
                if (typeof errMsg === 'object') {
                    errMsg = JSON.stringify(errMsg);
                }
                throw new Error(errMsg);
            }
            
            const data = await res.json();
            const content = data.explanations[depth];
            
            // Render markdown content
            responseContent.innerHTML = marked.parse(content || "_Empty response generated._");
            
            // Update telemetry
            updateTelemetry(data, startTime);
            renderCitations(data.citations || []);
        }

        async function handleStreamingRequest(payload, depth, startTime, apiKey) {
            const res = await fetch('/api/query/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                let errMsg = errData.detail || `HTTP ${res.status}`;
                if (typeof errMsg === 'object') {
                    errMsg = JSON.stringify(errMsg);
                }
                throw new Error(errMsg);
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let accumulatedContent = "";
            let metadata = null;
            let citations = [];
            
            let buffer = "";
            let currentEvent = "message";

            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    flushSseBuffer(buffer);
                    break;
                }
                
                buffer += decoder.decode(value, { stream: true });
                
                let newlineIndex;
                while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
                    const line = buffer.slice(0, newlineIndex).replace(/\r$/, '');
                    buffer = buffer.slice(newlineIndex + 1);
                    processSseLine(line);
                }
            }

            function flushSseBuffer(remaining) {
                if (!remaining.trim()) return;
                remaining.split('\n').forEach((line) => processSseLine(line.replace(/\r$/, '')));
            }

            function processSseLine(line) {
                if (!line) return;
                if (line.startsWith('event: ')) {
                    currentEvent = line.substring(7).trim();
                    return;
                }
                if (!line.startsWith('data: ')) return;

                const dataStr = line.substring(6).trim();
                if (dataStr === '[DONE]' || !dataStr) return;

                try {
                    const parsed = JSON.parse(dataStr);

                    const chunkText = parsed.chunk || parsed.c;
                    if (chunkText && (currentEvent === 'chunk' || currentEvent === 'message' || !currentEvent)) {
                        accumulatedContent += chunkText;
                        responseContent.innerHTML = marked.parse(accumulatedContent + ' <span class="animate-pulse text-emerald-400">▌</span>');
                        outputContainer.scrollTop = outputContainer.scrollHeight;
                    }

                    if (parsed.type === 'metadata' || (currentEvent === 'meta' && (parsed.metadata || parsed.citations))) {
                        metadata = parsed.metadata || metadata || {};
                        if (parsed.citations && parsed.citations.length > 0) {
                            citations = parsed.citations;
                        }
                    }
                } catch (e) {
                    console.warn("Failed to parse SSE chunk", e, dataStr);
                }
            }
            
            // Final render without cursor
            responseContent.innerHTML = marked.parse(accumulatedContent || "_Stream completed empty._");
            
            if (metadata) {
                updateTelemetry({ metadata }, startTime);
            }
            if (citations.length > 0) {
                renderCitations(citations);
            }
        }
        
        function updateTelemetry(data, startTime) {
            const duration = Math.round(performance.now() - startTime);
            telemetryBadges.style.display = 'flex';
            
            badgeTime.textContent = `${duration}ms`;
            
            if (data.metadata) {
                const model = data.metadata.model_alias || 'Unknown';
                const cached = data.cached ? ' [CACHE]' : '';
                badgeModel.textContent = `${model}${cached}`;
                
                if (data.metadata.token_usage) {
                    const tokens = data.metadata.token_usage.total_tokens;
                    badgeModel.setAttribute('title', `${tokens} tokens used`);
                }
            }
        }
        
        function renderCitations(citations) {
            if (!citations || citations.length === 0) return;
            
            citationsList.innerHTML = '';
            
            // Deduplicate by source for cleaner UI
            const uniqueSources = new Map();
            citations.forEach(c => {
                if (c.source && !uniqueSources.has(c.source)) {
                    uniqueSources.set(c.source, c);
                }
            });
            
            Array.from(uniqueSources.values()).slice(0, 6).forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'px-3 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-slate-300 flex items-center gap-1.5 hover:bg-slate-700 transition-colors cursor-default';
                
                const score = c.score ? Math.round(c.score * 100) : null;
                const scoreHtml = score ? `<span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1 rounded">${score}%</span>` : '';
                
                // Truncate long URLs or paths
                let displaySource = c.source;
                if (displaySource.length > 30) {
                    displaySource = '...' + displaySource.substring(displaySource.length - 27);
                }
                
                btn.innerHTML = `
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    <span class="truncate max-w-[150px]" title="${c.source}">${displaySource}</span>
                    ${scoreHtml}
                `;
                citationsList.appendChild(btn);
            });
            
            citationsPanel.style.display = 'block';
        }
    </script>
</body>
</html>
