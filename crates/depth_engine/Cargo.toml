[package]
name = "depth_engine"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "depth_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
pythonize = "0.29.0"
anydoc = "0.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"


