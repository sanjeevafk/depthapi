version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env.local
    depends_on:
      - redis
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: api/Dockerfile.test
    env_file:
      - .env.local
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0

volumes:
  redis-data:
