services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: depthapi
      POSTGRES_USER: depthapi
      POSTGRES_PASSWORD: depthapi
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/migrations/002_concepts_graph.sql:/docker-entrypoint-initdb.d/002_concepts_graph.sql:ro
      - ./db/migrations/003_fixes.sql:/docker-entrypoint-initdb.d/003_fixes.sql:ro
      - ./db/migrations/004_dense_search.sql:/docker-entrypoint-initdb.d/004_dense_search.sql:ro
      - ./db/seed/001_dev_api_key.sql:/docker-entrypoint-initdb.d/004_dev_api_key.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depthapi"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
volumes:
  pg_data:
