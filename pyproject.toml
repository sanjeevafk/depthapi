[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depthapi"
version = "0.1.0"
description = "DepthAPI: The Cognitive Synthesis Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.1",
    "orjson>=3.9.13",
    "structlog>=24.1.0",
    "openai>=1.51.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "slowapi>=0.1.9",
    "tiktoken>=0.7.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "filelock>=3.12.0",
    "asyncpg>=0.29.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "coverage>=7.6.0",
    "pytest-cov>=5.0.0",
    "pandas>=2.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "tests"]
norecursedirs = ["datasets", ".venv", "node_modules"]
addopts = "--cov=api --cov-report=term-missing"

# NOTE: pyright is configured in pyrightconfig.json (single source of truth).
# The [tool.pyright] stanza was removed to avoid drift.

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "target",
    "datasets",
    ".agent",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E741", "F841"]
